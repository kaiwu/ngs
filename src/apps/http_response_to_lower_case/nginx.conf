
events {  }

http {
    js_path "/etc/nginx/njs/";

    js_import main from app.js;

    server {
        listen 80;

        location / {
            js_body_filter main.to_lower_case;
            proxy_pass http://localhost:8080;
        }

    }

    server {
        listen 8080;

        location / {
            return 200 'Hello World';
        }

    }
}
