
events {  }

env SECRET_KEY;

http {
    js_path "/etc/nginx/njs/";

    js_import main from app.js;

    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;

        location /secure/ {
            js_content main.authorize;
        }

        location @app-backend {
            proxy_pass http://backend;
        }

    }

    server {
        listen 127.0.0.1:8081;
        return 200 "BACKEND:$uri\n";
    }

}
