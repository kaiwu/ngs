
events {  }

stream {
    js_path "/etc/nginx/njs/";

    js_import main from app.js;

    server {
        listen 80;

        js_preread main.preread_verify;

        proxy_pass 127.0.0.1:8081;
    }

    server {
        listen 8081;

        return BACKEND\n;
    }

}

http {
    js_path "/etc/nginx/njs/";

    js_import main from app.js;

    server {
        listen 8080;

        server_name aaa;

        location /validate {
            js_content main.validate;
        }

    }
}
