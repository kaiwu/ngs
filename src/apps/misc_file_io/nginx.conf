
events {  }

http {
    js_path "/etc/nginx/njs/";

    js_import utils.js;
    js_import main from app.js;

    server {
        listen 80;

        location /version {
            js_content utils.version;
        }

        location /push {
            js_content main.push;
        }

        location /flush {
            js_content main.flush;
        }

        location /read {
            js_content main.read;
        }

    }
}
