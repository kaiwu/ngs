daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";
    js_import main from app.js;
    keepalive_timeout 0;

    server {
        listen 8888;

        location = /sync {
            js_content main.sync;
        }

        location = /async {
            js_content main.async_crypto;
        }

        location / {
            return 404;
        }
    }
}
