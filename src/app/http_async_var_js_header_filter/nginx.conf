daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        js_set $async_header main.choose_header_value;

        location / {
            js_content main.header_filter;
        }
    }
}
