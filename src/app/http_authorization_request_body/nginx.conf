daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 8888;

        location /secure/ {
            js_content main.authorize;
        }

        location @app-backend {
            proxy_pass http://backend;
        }
    }

    # Backend server that returns success response
    server {
        listen 127.0.0.1:8081;
        
        location / {
            return 200 "BACKEND OK: $uri\n";
        }
    }
}
