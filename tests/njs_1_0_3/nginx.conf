daemon off;
master_process off;
error_log logs/error.log info;
pid logs/nginx.pid;
events { worker_connections 64; }

http {
    access_log off;
    keepalive_timeout 0;
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;
    js_engine qjs;
    js_context_reuse 1;
    js_path "njs/";
    js_import main from app.js;
    js_shared_dict_zone zone=counters:512k type=number timeout=1m;
    include persistence.conf;

    server {
        listen 127.0.0.1:8888;
        location = / { js_content main.version; }
        location = /args { js_content main.args; }
        location = /query-helpers { js_content main.queryHelpers; }
        location = /dict-values { js_content main.dictValues; }
        location = /dict-collection { js_content main.dictCollection; }
        location = /gcm { js_content main.gcm; }
        location = /optional-headers { js_content main.optionalHeaders; }
        location = /digest { js_content main.digest; }
        location = /hmac { js_content main.emptyHmac; }
        location = /decode { js_content main.decode; }
        location = /reply { js_content main.reply; }
        location = /child { internal; js_content main.child; }
        location = /fetch { js_content main.fetchObjects; }
        location = /timer { js_content main.cancelTimer; }
        location = /seed { js_content main.seed; }
        location = /expired { js_content main.expired; }
        location = /update { js_content main.update; }
        location = /saved { js_content main.saved; }
        location = /stream-origin { return 200 "stream peer\n"; }
        include transport.conf;
    }
}

stream {
    js_engine qjs;
    js_path "njs/";
    js_import main from app.js;
    js_var $message;
    include stream-transport.conf;
    server {
        listen 127.0.0.1:18889;
        js_access main.streamAccess;
        js_filter main.streamFilter;
        proxy_pass 127.0.0.1:8888;
    }
}
