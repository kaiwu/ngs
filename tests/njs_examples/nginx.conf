daemon off;
error_log logs/error.log info;
pid logs/nginx.pid;
env SECRET_KEY=example-test-key;

events { worker_connections 64; }

http {
    access_log off;
    keepalive_timeout 0;
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;
    js_engine qjs;
    js_path "../../submodules/njs-examples/njs/http/access";
    js_path "../../submodules/njs-examples/njs/http/certs/js";
    js_import signed from auth_signature_body.js;
    js_import remote from auth_remote_service.js;
    js_import quota from rate_limit_per_key.js;
    js_import routing from route_by_form.js;
    js_import certs from certificates.mjs;
    js_var $user;
    js_var $upstream;
    js_shared_dict_zone zone=quota:512k type=number timeout=10s;

    server {
        listen 127.0.0.1:8888;
        location = / { return 200 "ready"; }
        location /secure/ {
            js_access signed.authorize;
            proxy_pass http://127.0.0.1:8081;
        }
        location /protected/ {
            js_access remote.auth;
            proxy_set_header X-User $user;
            proxy_pass http://127.0.0.1:8081;
        }
        location /api/ {
            js_access quota.rate_limit;
            proxy_pass http://127.0.0.1:8081;
        }
        location = /submit {
            js_access routing.route;
            proxy_pass http://$upstream;
        }
        location = /der { js_content certs.der; }
        location = /san { js_content certs.san; }
    }

    # The example handlers select these three loopback ports themselves.
    server {
        listen 127.0.0.1:8079;
        location = /introspect { js_content remote.introspect; }
    }
    server {
        listen 127.0.0.1:8081;
        location /secure/ { js_content signed.echo_body; }
        location /protected/ { js_content remote.whoami; }
        location /api/ { js_content quota.whoami; }
        location = /submit { js_content routing.echo; }
    }
    server {
        listen 127.0.0.1:8082;
        location = /submit { js_content routing.echo; }
    }
}
